name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Guards the boundaries the architecture relies on.
      - name: Layering
        run: ./scripts/check-layering.sh

      # The UI's types are generated from penguinwave-proto, never written by
      # hand. This fails the build if the committed output has drifted.
      - name: Bindings freshness
        run: ./scripts/check-bindings.sh

      # Packaging faults surface at install time, on a user's machine.
      - name: Packaging
        run: ./scripts/check-packaging.sh

      # invoke() is untyped by command name, so a call to a deleted or
      # renamed Tauri command type-checks and fails only at runtime.
      - name: UI Tauri commands
        run: ./scripts/check-ui-commands.sh

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ui

      # The UI imports the generated bindings directly, so a protocol change
      # that the frontend has not followed fails here rather than at runtime.
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: ui

      - name: Build
        run: npx vite build
        working-directory: ui
