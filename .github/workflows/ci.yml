name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Guards the boundaries the architecture relies on.
      - name: Layering
        run: ./scripts/check-layering.sh

      # The UI's types are generated from penguinwave-proto, never written by
      # hand. This fails the build if the committed output has drifted.
      - name: Bindings freshness
        run: ./scripts/check-bindings.sh
